services:
  render:
    build: .
    volumes:
      - ./pages:/app/pages
    environment:
      - NODE_ENV=production
    deploy:
      replicas: 3

  nginx:
    image: nginx:alpine
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "9901:80"
    depends_on:
      - render
